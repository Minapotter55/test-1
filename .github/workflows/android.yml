name: Build Android APK

on:
  push:
    paths:
      - 'www/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Parser tests
        run: |
          npm ci
          npm test

      - name: Create Android project
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap add android

      - name: Native code, permissions and icons
        run: |
          JAVA_DIR=android/app/src/main/java/com/masroofy/app
          cp resources/android/java/*.java "$JAVA_DIR/"
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          # المايك، قراية الرسايل، والوصول لخدمة التعرف على الصوت في أندرويد 11+
          s = s.replace('</manifest>', """    <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          </manifest>""")
          s = s.replace('</application>', """    <receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>
              </application>""")
          open(p, 'w').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/android/mipmap-$d/ic_launcher.png "$RES/mipmap-$d/ic_launcher.png"
            cp resources/android/mipmap-$d/ic_launcher_round.png "$RES/mipmap-$d/ic_launcher_round.png"
            rm -f "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      # نفس مفتاح التوقيع في كل بناء، عشان النسخه الجديده تتثبت فوق القديمه من غير ما تمسح البيانات
      - name: Fixed signing key and version
        run: |
          mkdir -p ~/.android
          cp resources/android/signing/debug.keystore ~/.android/debug.keystore
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sync web app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Masroofy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Masroofy-apk
          path: Masroofy.apk

      # إصدار ثابت باسم masroofy عشان اللينك ميتغيرش، ومنفصل عن إصدارات أي تطبيق تاني في الريبو
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: masroofy
          name: مصروفي (أندرويد)
          make_latest: 'false'
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          body: |
            نزّل Masroofy.apk على موبايل أندرويد وافتحه عشان تثبته.
            لو ظهرت رسالة "مصدر غير معروف" اختار "السماح من هذا المصدر".
          files: Masroofy.apk
